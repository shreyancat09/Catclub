<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Hack Club</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --ink: #1b1b1f;
      --muted: #5a5a66;
      --border: #e3e1dc;
      --accent: #ec3750;
      --accent-soft: #fdecef;
      --green: #1f8b4c;
      --green-soft: #e7f6ed;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --max-w: 1020px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(250, 249, 246, 0.94);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 800;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .nav-links a {
      padding: 0.25rem 0;
      border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
