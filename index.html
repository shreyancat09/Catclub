<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Hack Club</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --ink: #1b1b1f;
      --muted: #5a5a66;
      --border: #e3e1dc;
      --accent: #ec3750;
      --accent-soft: #fdecef;
      --green: #1f8b4c;
      --green-soft: #e7f6ed;
      --amber: #b45309;
      --amber-soft: #fef3c7;
      --max-w: 1020px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Top bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(250, 249, 246, 0.94);
      backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 7px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 800;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .nav-links a {
      padding: 0.25rem 0;
      border-bottom: 2px solid transparent;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }

    /* Main container */
    main {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 1.25rem 4rem;
    }

    section {
      padding: 3.5rem 0;
      border-bottom: 1px solid var(--border);
      scroll-margin-top: 64px;
    }

    section:last-of-type {
      border-bottom: none;
    }

    /* Hero */
    .hero {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 2.25rem;
      align-items: center;
      padding-top: 3.25rem;
    }

    .club-tag {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.22rem 0.6rem;
      border-radius: 5px;
      margin-bottom: 0.85rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 2.75rem);
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-bottom: 1rem;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 52ch;
      margin-bottom: 1.5rem;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.05rem;
      border-radius: 7px;
      font-size: 0.92rem;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      border-color: #c7c4bc;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: #d62b43;
      border-color: #d62b43;
    }

    .hero-media {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.65rem;
    }
